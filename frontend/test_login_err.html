<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Test Invalid Login</title>
    <link rel="stylesheet" href="/css/style.css?v=3.4">
</head>
<body style="background: #06080f;">
    <div class="modal-overlay active" id="modal-overlay" style="opacity: 1; visibility: visible;">
        <div class="modal modal-login" id="modal-content"></div>
    </div>
    <div class="toast-container" id="toast-container"></div>
    <script src="/js/i18n.js?v=3.4"></script>
    <script src="/js/app.js?v=3.4"></script>
    <script src="/js/auth.js?v=3.4"></script>
    <script>
        I18n.init();
        Auth.showLoginModal();
        setTimeout(async () => {
            document.getElementById('login-username').value = 'wrong_user';
            document.getElementById('login-password').value = 'wrong_pass';
            const fakeEvent = { preventDefault: () => {} };
            await Auth._handleLoginForm(fakeEvent);
        }, 300);
    </script>
</body>
</html>
