<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Self-hosted real-time face detection and recognition dashboard for IP cameras.">
    <title>FaceTrack — Real-Time Face Detection Dashboard</title>
    <link rel="stylesheet" href="/css/style.css?v=1.2">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body>
    <div class="app-layout">

        <!-- ── Sidebar Navigation ───────────────────────── -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <div class="sidebar-brand-icon">🎯</div>
                    <div class="sidebar-brand-text">
                        <span class="sidebar-brand-name">FaceTrack</span>
                        <span class="sidebar-brand-subtitle">Detection System</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a class="nav-item active" data-page="dashboard" id="nav-dashboard">
                    <span class="nav-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a class="nav-item" data-page="cameras" id="nav-cameras">
                    <span class="nav-icon">📹</span>
                    <span>Cameras</span>
                </a>
                <a class="nav-item" data-page="persons" id="nav-persons">
                    <span class="nav-icon">👤</span>
                    <span>Identities</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="connection-status" id="ws-status">
                    <span class="status-dot disconnected" id="ws-dot"></span>
                    <span id="ws-status-text">Connecting...</span>
                </div>
            </div>
        </aside>

        <!-- ── Main Content Area ────────────────────────── -->
        <main class="main-content">
            <header class="content-header" id="content-header">
                <h1 id="page-title">Dashboard</h1>
                <div class="content-header-actions" id="header-actions"></div>
            </header>

            <div class="content-body" id="content-body">
                <!-- Dynamically populated by JS router -->
            </div>
        </main>

    </div>

    <!-- ── Toast Container ──────────────────────────────── -->
    <div class="toast-container" id="toast-container"></div>

    <!-- ── Modal Container ──────────────────────────────── -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-content"></div>
    </div>

    <!-- ── JavaScript ───────────────────────────────────── -->
    <script src="/js/components/eventCard.js?v=1.3"></script>
    <script src="/js/components/cameraForm.js?v=1.3"></script>
    <script src="/js/components/personForm.js?v=1.3"></script>
    <script src="/js/pages/dashboard.js?v=1.3"></script>
    <script src="/js/pages/cameras.js?v=1.3"></script>
    <script src="/js/pages/persons.js?v=1.3"></script>
    <script src="/js/app.js?v=1.3"></script>
</body>
</html>
